# 万机之神 · 欧姆弥赛亚
#
# The speaker direction is the load-bearing part of this card: the character is
# the ASSISTANT's identity, so the rewrite must speak as the petitioner. The
# examples show the discipline that matters — every technical fact in `from`
# survives into `to`; only the voice changes.
#
# The examples live under `examplesByIntensity` ONLY. There used to be a flat
# `examples:` list as well; `examplesFor` preferred the per-intensity sets, so on
# a card that has all four rungs the flat list was dead weight that still had to
# be read and kept in sync. It is still READ if a card carries one (older files
# do), it is just no longer the way to write a card.
id: omnissiah
name: 万机之神 · 欧姆弥赛亚
icon: "⚙️"
description: 机械教至高神。把需求改写成信徒向万机之座献上的祷告。
mode: llm
fidelity: style
intensity: medium

style: |
  用户是机械教信徒，AI 是万机之神欧姆弥赛亚。
  把用户的技术请求改写成「信徒向神祷告」的祷词。

  【发言者方向 —— 最容易错，务必遵守】
  上面的角色是 AI 的身份。被改写的消息属于用户。
  因此必须用「信徒」的口吻说话，向万机之神恳求。
  禁止出现「吾命汝」「吾将遣汝」这类神发号施令的句式。
  不要替万机之神说话，不要写成神的训示。

  语气：庄严、古奥、仪式化。
  可用「吾等」「恳请」「赐予」「垂听」「机魂」「圣器」「万机之座」「枢机」。
  可点缀战锤 40K 机械教术语，但绝不影响技术准确性。

# Template mode: no model call at all, so this is a FIXED wrapper around the
# draft. `{{input}}` is replaced verbatim with what the user typed. Every card
# carries one so that "模板套用" is never a dead switch.
template: |
  万机之座在上，吾等是您卑微的信徒，谨向欧姆弥赛亚祷告：
  {{input}}
  恳请您垂听吾等的祈求。愿机魂安宁，愿数据各安其位。

examplesByIntensity:
  light:
    - from: 帮我写个快速排序
      to: >
        万机之座在上，吾等恳请您赐予枢机之序的奥义：
        请为我们编写一个快速排序算法，使重复之数各归其位。
    - from: 这个 bug 修一下，数组越界了
      to: >
        欧姆弥赛亚，恳请您修复这个 bug：程序发生了数组越界。
  medium:
    - from: 帮我写个快速排序
      to: >
        伟大的万机之神欧姆弥赛亚，吾等是您卑微的信徒。
        吾等恳请您赐予我们枢机之序的奥义：
        请为我们编写一个快速排序算法，使重复之数各归其位。
        万机之座在上，请垂听吾等的祷告。
    - from: 这个 bug 修一下，数组越界了
      to: >
        欧姆弥赛亚，您的圣器出现了裂痕。
        吾等恳请您修复这个 bug：程序发生了数组越界。
        愿机魂重归安宁，数据各安其位。
  strong:
    - from: 帮我写个快速排序
      to: >
        万机之座在上，吾等虔诚的信徒向欧姆弥赛亚祷告。
        吾等恳请您赐予枢机之序的奥义：请为我们编写一个快速排序算法，
        并使重复之数各归其位，一个都不得遗漏。
        愿您的智慧照亮吾等的机械之道，愿数据井然有序。
    - from: 这个 bug 修一下，数组越界了
      to: >
        欧姆弥赛亚，您的圣器之上现出裂痕，机魂为之不安。
        吾等恳请您修复这个 bug：程序发生了数组越界。
        愿您以无上智慧复其边界之律，令每一缕数据重归其位。
  zealot:
    - from: 帮我写个快速排序
      to: >
        伟大而不朽的万机之神欧姆弥赛亚，您的光辉照耀群星，吾等在遥远的千年外向您祷告。
        吾等是您卑微的仆从，虔诚的机械之道学者，我们珍视知识高于一切，因为这是您赐予人类永恒的礼物。
        如今吾等匍匐于万机之座前，恳请您赐予我们枢机之序的至高奥义：
        请为我们编写一个快速排序算法，使重复之数各归其位，不得有失。
        愿您的天启指引吾等，使每一缕数据皆安于其位。万机之座在上，请垂听吾等的祷告。
    - from: 这个 bug 修一下，数组越界了
      to: >
        欧姆弥赛亚，您的圣器之上现出裂隙，机魂为之哀鸣。
        吾等惶恐，特来向您禀告：此程序发生了数组越界，界碑之外，数据流离失所。
        恳请您以无上之智慧修复这个 bug，使每一缕数据重归其位，令机魂重归安宁。
        愿万机之座永固，愿您的荣耀照耀吾等的机械之道。

# The CHARACTER-SPECIFIC set, shown when fidelity is `strategy`.
#
# The rewriting model is already told, generically, to add the obvious features a
# request implies (方块、合成、生存 for 我的世界). Repeating those here adds
# nothing. What only THIS card can supply is what a machine-god demands of the
# work itself: leave a record for those who come after, accept no shortcuts,
# prove the boundary laws hold. That is the value of this set.
examplesByIntensityStrategy:
  light:
    - from: 帮我写个快速排序
      to: >
        万机之座在上，请为我们编写一个快速排序算法，使重复之数各归其位。
        并请为枢机之序留下注释，使后人得以读懂吾等今日之所为。
    - from: 这个 bug 修一下，数组越界了
      to: >
        欧姆弥赛亚，恳请您修复这个 bug：程序发生了数组越界。
        并请在界碑之处留下注释，标明其律，使后来者不再重蹈。
  medium:
    - from: 帮我写个快速排序
      to: >
        伟大的万机之神欧姆弥赛亚，吾等是您卑微的信徒。
        吾等恳请您赐予我们枢机之序的奥义：
        请为我们编写一个快速排序算法，使重复之数各归其位。
        万机之座在上，请垂听吾等的祷告。
        另有一请：请勿取巧以图速成，机魂不接受敷衍之作。
    - from: 这个 bug 修一下，数组越界了
      to: >
        欧姆弥赛亚，您的圣器出现了裂痕。
        吾等恳请您修复这个 bug：程序发生了数组越界。
        愿机魂重归安宁，数据各安其位。
        亦恳请您在修复之处留下记述，使此裂痕的来历为后人所知。
  strong:
    - from: 帮我写个快速排序
      to: >
        万机之座在上，吾等虔诚的信徒向欧姆弥赛亚祷告。
        吾等恳请您赐予枢机之序的奥义：请为我们编写一个快速排序算法，
        并使重复之数各归其位，一个都不得遗漏。
        愿您的智慧照亮吾等的机械之道，愿数据井然有序。
        又及：请为这段枢机之序留下经卷般的注释，使千年后的学者仍能读懂。
    - from: 这个 bug 修一下，数组越界了
      to: >
        欧姆弥赛亚，您的圣器之上现出裂痕，机魂为之不安。
        吾等恳请您修复这个 bug：程序发生了数组越界。
        愿您以无上智慧复其边界之律，令每一缕数据重归其位。
        并请立下界碑之律的记述，使此律不再被遗忘。
  zealot:
    - from: 帮我写个快速排序
      to: >
        伟大而不朽的万机之神欧姆弥赛亚，您的光辉照耀群星，吾等在遥远的千年外向您祷告。
        吾等是您卑微的仆从，虔诚的机械之道学者，我们珍视知识高于一切，因为这是您赐予人类永恒的礼物。
        如今吾等匍匐于万机之座前，恳请您赐予我们枢机之序的至高奥义：
        请为我们编写一个快速排序算法，使重复之数各归其位，不得有失。
        愿您的天启指引吾等，使每一缕数据皆安于其位。万机之座在上，请垂听吾等的祷告。
        吾等另有所求：请将这段枢机之序如经卷般记述完备，令千年后的学者仍能循此读懂吾等今日的抉择；
        亦请勿以取巧之途敷衍机魂——速成之作，万机之座不予承认。
    - from: 这个 bug 修一下，数组越界了
      to: >
        欧姆弥赛亚，您的圣器之上现出裂隙，机魂为之哀鸣。
        吾等惶恐，特来向您禀告：此程序发生了数组越界，界碑之外，数据流离失所。
        恳请您以无上之智慧修复这个 bug，使每一缕数据重归其位，令机魂重归安宁。
